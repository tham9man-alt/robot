                  }
              }

              private fun checkTasks() {
                  val c = Calendar.getInstance()
                  val nowMin = c.get(Calendar.HOUR_OF_DAY) * 60 + c.get(Calendar.MINUTE)
                  val day = dayString()
                  val due = TaskStore.load(this).firstOrNull {
                      if (it.done) {
                          false
                      } else if (it.date.isNotEmpty()) {
                          // مهمة بتاريخ: تذكير مرة واحدة، وبدون وقت تُذكَّر الساعة 09:00
                          val target = if (it.minutes >= 0) it.minutes else 540
                          it.firedDay.isEmpty() &&
                              (it.date < day || (it.date == day && nowMin >= target))
                      } else {
                          it.minutes >= 0 &&
                              nowMin >= it.minutes && nowMin - it.minutes < 120 &&
                              it.firedDay != day
                      }
                  }
                  if (due != null) {
