                      PixelFormat.TRANSLUCENT
                  )
                  bubbleParams.gravity = Gravity.TOP or Gravity.START
              }

              private fun buildBubble(): TextView {
                  val dm = resources.displayMetrics
                  val b = TextView(this)
                  b.setTextColor(Color.rgb(38, 50, 56))
                  b.textSize = 14f
                  b.gravity = Gravity.CENTER
                  b.setPadding(dp(12), dp(8), dp(12), dp(8))
                  b.maxWidth = (dm.widthPixels * 0.7f).toInt()
                  val bg = GradientDrawable()
                  bg.setColor(Color.WHITE)
                  bg.cornerRadius = dp(14).toFloat()
                  bg.setStroke(dp(1), Color.rgb(176, 190, 197))
                  b.background = bg
                  return b
              }

              private fun showBubble(text: String) {
                  val dm = resources.displayMetrics
                  val b = bubble ?: buildBubble().also { bubble = it }
                  b.text = text
                  b.measure(
                      View.MeasureSpec.makeMeasureSpec((dm.widthPixels * 0.7f).toInt(), View.MeasureSpec.AT_MOST),
                      View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED)
                  )
                  bubbleW = b.measuredWidth
                  bubbleH = b.measuredHeight
                  if (!bubbleShown) {
                      wm.addView(b, bubbleParams)
                      bubbleShown = true
                  }
                  positionBubble()
              }

              private fun positionBubble() {
                  val b = bubble ?: return
                  if (!bubbleShown) return
                  val dm = resources.displayMetrics
                  val x = (params.x + sizePx / 2 - bubbleW / 2)
                      .coerceIn(0, (dm.widthPixels - bubbleW).coerceAtLeast(0))
                  val y = (params.y - bubbleH - dp(6)).coerceAtLeast(0)
                  bubbleParams.x = x
                  bubbleParams.y = y
                  runCatching { wm.updateViewLayout(b, bubbleParams) }
              }

              private fun removeBubble() {
                  val b = bubble
                  if (b != null && bubbleShown) {
                      runCatching { wm.removeView(b) }
                  }
                  bubbleShown = false
              }

