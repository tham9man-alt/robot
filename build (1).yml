              private fun taskLine(t: Task): String {
                  val parts = ArrayList<String>()
                  if (t.date.isNotEmpty()) parts.add(t.date)
                  if (t.minutes >= 0) parts.add(TaskStore.fmt(t.minutes))
                  return if (parts.isEmpty()) t.text else t.text + " (" + parts.joinToString(" ") + ")"
              }

              private fun beep() {
