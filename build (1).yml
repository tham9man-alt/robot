                          accStroke.strokeWidth = 2f * u
                          canvas.drawCircle(39f * u, 36f * u, 8f * u, accStroke)
                          canvas.drawCircle(61f * u, 36f * u, 8f * u, accStroke)
                          canvas.drawLine(47f * u, 36f * u, 53f * u, 36f * u, accStroke)
