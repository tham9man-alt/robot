name: Build Robot APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app app/src/main app/src/main/java/com/example/robotoverlay
          cat > settings.gradle.kts <<'ROBOT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RobotOverlay"
          include(":app")
          ROBOT_EOF
          cat > build.gradle.kts <<'ROBOT_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ROBOT_EOF
          cat > gradle.properties <<'ROBOT_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          ROBOT_EOF
          cat > app/build.gradle.kts <<'ROBOT_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.robotoverlay"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.robotoverlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          ROBOT_EOF
          cat > app/src/main/AndroidManifest.xml <<'ROBOT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="Robot"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RobotService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating animated character overlay" />
                  </service>
              </application>
          </manifest>
          ROBOT_EOF
          cat > app/src/main/java/com/example/robotoverlay/MainActivity.kt <<'ROBOT_EOF'
          package com.example.robotoverlay

          import android.Manifest
          import android.app.Activity
          import android.app.DatePickerDialog
          import android.app.TimePickerDialog
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import java.util.Calendar
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var listBox: LinearLayout
              private lateinit var colorBox: LinearLayout
              private lateinit var input: EditText
              private lateinit var timeBtn: Button
              private lateinit var dateBtn: Button
              private lateinit var styleBox: LinearLayout
              private lateinit var quoteBox: LinearLayout
              private lateinit var quoteInput: EditText
              private var pickedMinutes = -1
              private var pickedDate = ""

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  root.setPadding(dp(20), dp(28), dp(20), dp(28))

                  val title = TextView(this)
                  title.text = "الروبوت الصغير 🤖"
                  title.textSize = 24f
                  title.gravity = Gravity.CENTER

                  val hint = TextView(this)
                  hint.text = "شغّله ليظهر فوق كل التطبيقات. اضغط عليه ليحكي، اضغط مرتين لقائمة البريد والأدوات، اضغط مطولاً لنكتة، واسحبه لأي مكان."
                  hint.gravity = Gravity.CENTER
                  hint.setPadding(0, dp(8), 0, dp(12))

                  val buttons = LinearLayout(this)
                  buttons.orientation = LinearLayout.HORIZONTAL
                  val start = Button(this)
                  start.text = "تشغيل الروبوت"
                  start.setOnClickListener { startRobot() }
                  val stop = Button(this)
                  stop.text = "إيقاف الروبوت"
                  stop.setOnClickListener {
                      stopService(Intent(this@MainActivity, RobotService::class.java))
                  }
                  buttons.addView(start, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  buttons.addView(stop, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

                  val water = Switch(this)
                  water.text = "تذكير بشرب الماء كل ساعة"
                  water.isChecked = TaskStore.water(this)
                  water.setOnCheckedChangeListener { _, on -> TaskStore.setWater(this@MainActivity, on) }
                  water.setPadding(0, dp(12), 0, dp(12))

                  val sound = Switch(this)
                  sound.text = "صوت التنبيهات"
                  sound.isChecked = TaskStore.sound(this)
                  sound.setOnCheckedChangeListener { _, on -> TaskStore.setSound(this@MainActivity, on) }
                  sound.setPadding(0, dp(4), 0, dp(12))

                  styleBox = LinearLayout(this)
                  styleBox.orientation = LinearLayout.VERTICAL

                  val colorTitle = TextView(this)
                  colorTitle.text = "لون الروبوت"
                  colorTitle.textSize = 20f
                  colorTitle.setPadding(0, dp(8), 0, dp(4))

                  colorBox = LinearLayout(this)
                  colorBox.orientation = LinearLayout.VERTICAL

                  val tasksTitle = TextView(this)
                  tasksTitle.text = "مهامي"
                  tasksTitle.textSize = 20f
                  tasksTitle.setPadding(0, dp(8), 0, dp(4))

                  input = EditText(this)
                  input.hint = "مهمة جديدة"
                  input.isSingleLine = true

                  timeBtn = Button(this)
                  timeBtn.text = "⏰ بدون وقت"
                  timeBtn.setOnClickListener { pickTime() }
                  timeBtn.setOnLongClickListener {
                      pickedMinutes = -1
                      timeBtn.text = "⏰ بدون وقت"
                      true
                  }

                  dateBtn = Button(this)
                  dateBtn.text = "📅 كل يوم"
                  dateBtn.setOnClickListener { pickDate() }
                  dateBtn.setOnLongClickListener {
                      pickedDate = ""
                      dateBtn.text = "📅 كل يوم"
                      true
                  }

                  val inputRow = LinearLayout(this)
                  inputRow.orientation = LinearLayout.HORIZONTAL
                  inputRow.gravity = Gravity.CENTER_VERTICAL
                  inputRow.addView(input, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

                  val pickRow = LinearLayout(this)
                  pickRow.orientation = LinearLayout.HORIZONTAL
                  pickRow.addView(dateBtn, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  pickRow.addView(timeBtn, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))

                  val addBtn = Button(this)
                  addBtn.text = "أضف المهمة"
                  addBtn.setOnClickListener { addTask() }

                  val timeHint = TextView(this)
                  timeHint.text = "التاريخ والوقت اختياريان، واضغط على أيٍّ منهما مطولاً لإلغائه. بتاريخ فقط: يذكّرك الروبوت الساعة 09:00. بوقت فقط: يتكرر كل يوم حتى تنجز المهمة."
                  timeHint.textSize = 12f
                  timeHint.setPadding(0, dp(4), 0, dp(8))

                  listBox = LinearLayout(this)
                  listBox.orientation = LinearLayout.VERTICAL

                  root.addView(title)
                  root.addView(hint)
                  root.addView(buttons)
                  root.addView(water)
                  root.addView(sound)
                  root.addView(colorTitle)
                  root.addView(colorBox)
                  root.addView(styleBox)
                  root.addView(tasksTitle)
                  root.addView(inputRow)
                  root.addView(pickRow)
                  root.addView(timeHint)
                  root.addView(addBtn)
                  root.addView(listBox)

                  val quoteTitle = TextView(this)
                  quoteTitle.text = "اقتباساتي 💬"
                  quoteTitle.textSize = 20f
                  quoteTitle.setPadding(0, dp(20), 0, dp(4))
                  val quoteHint = TextView(this)
                  quoteHint.text = "اكتب أقوالاً تحبها (مثل أقوال مصطفى محمود) بصياغتك أو كما وردت في مصدر موثوق، وسيقولها الروبوت من قائمة الضغط المزدوج."
                  quoteHint.textSize = 12f
                  quoteInput = EditText(this)
                  quoteInput.hint = "اقتباس جديد"
                  val quoteAdd = Button(this)
                  quoteAdd.text = "أضف الاقتباس"
                  quoteAdd.setOnClickListener {
                      val q = quoteInput.text.toString().trim()
                      if (q.isNotEmpty()) {
                          TaskStore.addQuote(this@MainActivity, q)
                          quoteInput.text.clear()
                          refreshQuotes()
                      }
                  }
                  quoteBox = LinearLayout(this)
                  quoteBox.orientation = LinearLayout.VERTICAL
                  root.addView(quoteTitle)
                  root.addView(quoteHint)
                  root.addView(quoteInput)
                  root.addView(quoteAdd)
                  root.addView(quoteBox)

                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)

                  refreshColors()
                  refreshStyle()
                  refreshQuotes()
                  refresh()
              }

              private fun chipRow(title: String, items: List<String>, selected: Int, onPick: (Int) -> Unit): View {
                  val wrap = LinearLayout(this)
                  wrap.orientation = LinearLayout.VERTICAL
                  val t = TextView(this)
                  t.text = title
                  t.textSize = 18f
                  t.setPadding(0, dp(12), 0, dp(4))
                  wrap.addView(t)
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  for (i in items.indices) {
                      val b = Button(this)
                      b.text = items[i]
                      b.textSize = 12f
                      b.isEnabled = i != selected
                      b.setOnClickListener { onPick(i) }
                      row.addView(b, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  }
                  wrap.addView(row)
                  return wrap
              }

              private fun refreshStyle() {
                  styleBox.removeAllViews()
                  styleBox.addView(chipRow("الإكسسوار", RobotStyle.accessories, TaskStore.accessory(this)) {
                      TaskStore.setAccessory(this@MainActivity, it)
                      refreshStyle()
                  })
                  styleBox.addView(chipRow("الحركة", RobotStyle.speeds, TaskStore.speed(this)) {
                      TaskStore.setSpeed(this@MainActivity, it)
                      refreshStyle()
                  })
              }

              private fun refreshQuotes() {
                  quoteBox.removeAllViews()
                  val list = TaskStore.quotes(this)
                  for (i in list.indices) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
                      val tv = TextView(this)
                      tv.text = "• " + list[i]
                      val del = Button(this)
                      del.text = "حذف"
                      del.setOnClickListener {
                          TaskStore.removeQuote(this@MainActivity, i)
                          refreshQuotes()
                      }
                      row.addView(tv, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      row.addView(del)
                      quoteBox.addView(row)
                  }
              }

              private fun pickDate() {
                  val c = Calendar.getInstance()
                  DatePickerDialog(this, { _, y, m, d ->
                      pickedDate = String.format(java.util.Locale.US, "%04d-%02d-%02d", y, m + 1, d)
                      dateBtn.text = "📅 " + pickedDate
                  }, c.get(Calendar.YEAR), c.get(Calendar.MONTH), c.get(Calendar.DAY_OF_MONTH)).show()
              }

              private fun refreshColors() {
                  colorBox.removeAllViews()
                  val selected = TaskStore.color(this)
                  val perRow = 4
                  var i = 0
                  while (i < RobotColors.body.size) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      var j = i
                      while (j < i + perRow && j < RobotColors.body.size) {
                          val idx = j
                          val dot = View(this)
                          val bg = GradientDrawable()
                          bg.shape = GradientDrawable.OVAL
                          bg.setColor(RobotColors.body[idx])
                          if (idx == selected) {
                              bg.setStroke(dp(4), Color.rgb(23, 37, 43))
                          } else {
                              bg.setStroke(dp(1), Color.rgb(120, 144, 156))
                          }
                          dot.background = bg
                          dot.contentDescription = RobotColors.names[idx]
                          dot.setOnClickListener {
                              TaskStore.setColor(this@MainActivity, idx)
                              refreshColors()
                          }
                          val lp = LinearLayout.LayoutParams(dp(52), dp(52))
                          lp.setMargins(dp(6), dp(6), dp(6), dp(6))
                          row.addView(dot, lp)
                          j++
                      }
                      colorBox.addView(row)
                      i += perRow
                  }
              }

              private fun pickTime() {
                  TimePickerDialog(this, { _, h, m ->
                      pickedMinutes = h * 60 + m
                      timeBtn.text = "⏰ " + TaskStore.fmt(pickedMinutes)
                  }, 9, 0, true).show()
              }

              private fun addTask() {
                  val text = input.text.toString().trim()
                  if (text.isEmpty()) {
                      input.error = "اكتب المهمة أولاً"
                      return
                  }
                  TaskStore.add(this, text, pickedMinutes, pickedDate)
                  input.text.clear()
                  pickedMinutes = -1
                  pickedDate = ""
                  timeBtn.text = "⏰ بدون وقت"
                  dateBtn.text = "📅 كل يوم"
                  refresh()
              }

              private fun refresh() {
                  listBox.removeAllViews()
                  val tasks = TaskStore.load(this).sortedBy { it.done }
                  if (tasks.isEmpty()) {
                      val empty = TextView(this)
                      empty.text = "ما في مهام بعد. أضف أول مهمة."
                      empty.setPadding(0, dp(12), 0, 0)
                      listBox.addView(empty)
                      return
                  }
                  for (t in tasks) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
                      row.setPadding(0, dp(6), 0, dp(6))

                      val label = TextView(this)
                      val time = (if (t.date.isNotEmpty()) "   📅 " + t.date else "") +
                          (if (t.minutes >= 0) "   ⏰ " + TaskStore.fmt(t.minutes) else "")
                      label.text = (if (t.done) "✓ " else "○ ") + t.text + time
                      label.textSize = 17f
                      if (t.done) {
                          label.paintFlags = label.paintFlags or Paint.STRIKE_THRU_TEXT_FLAG
                          label.alpha = 0.5f
                      }
                      label.setOnClickListener {
                          TaskStore.toggle(this@MainActivity, t.id)
                          refresh()
                      }

                      val del = Button(this)
                      del.text = "حذف"
                      del.setOnClickListener {
                          TaskStore.remove(this@MainActivity, t.id)
                          refresh()
                      }

                      row.addView(label, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                      row.addView(del)
                      listBox.addView(row)
                  }
              }

              private fun startRobot() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  startForegroundService(Intent(this, RobotService::class.java))
              }
          }
          ROBOT_EOF
          cat > app/src/main/java/com/example/robotoverlay/RobotView.kt <<'ROBOT_EOF'
          package com.example.robotoverlay

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.os.SystemClock
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.sin

          /** روبوت مرسوم بالكود: يتنفس، يرمش، يلوّح، ينام، ويلبس إكسسوارات. */
          class RobotView(context: Context) : View(context) {

              enum class State { IDLE, HAPPY, SLEEP }

              var state = State.IDLE
                  private set
              var walking = false
              var facing = 1f          // 1 = يمين، -1 = يسار
              var lookX = 0f           // -1..1 اتجاه نظر العيون

              private var happyUntil = 0L
              private var lastActive = SystemClock.uptimeMillis()

              private val metal = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(176, 190, 197) }
              private val dark = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(55, 71, 79) }
              private val white = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val glow = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(0, 229, 255) }
              private val shade = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.argb(46, 0, 0, 0) }
              private val shine = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.argb(110, 255, 255, 255) }
              private val blush = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.argb(150, 255, 138, 160) }
              private val gold = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(255, 193, 7) }
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(55, 71, 79)
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val accStroke = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(55, 71, 79)
                  isFakeBoldText = true
              }
              private val strokeWhite = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val rect = RectF()
              private val path = Path()

              private var bodyColor = Color.rgb(176, 190, 197)
              private var glowColor = Color.rgb(0, 229, 255)
              private var accessory = 0

              fun setTheme(body: Int, glowC: Int) {
                  bodyColor = body
                  glowColor = glowC
              }

              fun setAccessory(index: Int) {
                  accessory = index
              }

              fun poke() {
                  val now = SystemClock.uptimeMillis()
                  state = State.HAPPY
                  happyUntil = now + 1500
                  lastActive = now
              }

              fun touchActivity() {
                  val now = SystemClock.uptimeMillis()
                  lastActive = now
                  if (state == State.SLEEP) state = State.IDLE
              }

              override fun onDraw(canvas: Canvas) {
                  val now = SystemClock.uptimeMillis()
                  if (state == State.HAPPY && now > happyUntil) state = State.IDLE
                  if (state == State.IDLE && !walking && now - lastActive > 20_000) state = State.SLEEP
                  if (walking) lastActive = now

                  val t = now / 1000f
                  val u = width / 100f
                  line.strokeWidth = 3f * u
                  metal.color = bodyColor
                  glow.color = glowColor

                  val bob = when {
                      state == State.HAPPY -> -abs(sin(t * 10f)) * 9f * u
                      walking -> -abs(sin(t * 9f)) * 3f * u
                      state == State.SLEEP -> sin(t * 1.2f) * 1f * u
                      else -> sin(t * 3f) * 1.8f * u
                  }

                  canvas.save()
                  if (facing < 0) canvas.scale(-1f, 1f, width / 2f, height / 2f)
                  canvas.translate(0f, bob)

                  // هوائي
                  canvas.drawLine(50f * u, 18f * u, 50f * u, 9f * u, line)
                  val pulse = if (state == State.SLEEP) 3f else 4f + sin(t * 5f)
                  glow.alpha = if (state == State.SLEEP) 90 else 255
                  canvas.drawCircle(50f * u, 7f * u, pulse * u, glow)

                  // أرجل
                  rect.set(34f * u, 86f * u, 46f * u, 97f * u); canvas.drawRoundRect(rect, 3f * u, 3f * u, dark)
                  rect.set(54f * u, 86f * u, 66f * u, 97f * u); canvas.drawRoundRect(rect, 3f * u, 3f * u, dark)

                  // ذراع يسار (خلفية)
                  canvas.drawLine(28f * u, 64f * u, 17f * u, 80f * u, line)

                  // جسم
                  rect.set(28f * u, 56f * u, 72f * u, 88f * u); canvas.drawRoundRect(rect, 8f * u, 8f * u, metal)
                  // لوحة الصدر
                  rect.set(37f * u, 62f * u, 63f * u, 82f * u); canvas.drawRoundRect(rect, 5f * u, 5f * u, shade)
                  glow.alpha = 255
                  canvas.drawCircle(50f * u, 72f * u, 5f * u, glow)

                  // ذراع يمين: تلوّح عند الفرح
                  val armEndX: Float
                  val armEndY: Float
                  if (state == State.HAPPY) {
                      armEndX = 84f * u + sin(t * 14f) * 4f * u
                      armEndY = 40f * u
                  } else {
                      armEndX = 83f * u
                      armEndY = 80f * u + (if (walking) sin(t * 9f) * 3f * u else 0f)
                  }
                  canvas.drawLine(72f * u, 64f * u, armEndX, armEndY, line)

                  // أذنان
                  rect.set(16f * u, 28f * u, 24f * u, 44f * u); canvas.drawRoundRect(rect, 4f * u, 4f * u, dark)
                  rect.set(76f * u, 28f * u, 84f * u, 44f * u); canvas.drawRoundRect(rect, 4f * u, 4f * u, dark)

                  // رأس
                  rect.set(22f * u, 18f * u, 78f * u, 54f * u); canvas.drawRoundRect(rect, 11f * u, 11f * u, metal)
                  rect.set(27f * u, 23f * u, 73f * u, 49f * u); canvas.drawRoundRect(rect, 8f * u, 8f * u, dark)
                  // لمعة
                  rect.set(30f * u, 19.5f * u, 46f * u, 21.8f * u); canvas.drawRoundRect(rect, 1.2f * u, 1.2f * u, shine)

                  drawFace(canvas, u, t)
                  drawAccessory(canvas, u)
                  canvas.restore()

                  if (state == State.SLEEP) {
                      text.textSize = 11f * u
                      canvas.drawText("z", 78f * u, 20f * u - (t * 6f * u) % (8f * u), text)
                      text.textSize = 8f * u
                      canvas.drawText("z", 86f * u, 30f * u - (t * 5f * u) % (6f * u), text)
                  }

                  postInvalidateOnAnimation()
              }

              private fun drawFace(canvas: Canvas, u: Float, t: Float) {
                  val ex = floatArrayOf(39f, 61f)
                  val ey = 36f
                  when {
                      state == State.SLEEP -> {
                          for (x in ex) canvas.drawLine((x - 5f) * u, ey * u, (x + 5f) * u, ey * u, whiteStroke(u))
                      }
