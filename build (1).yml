                          path.lineTo(68f * u, 7f * u)
                          path.lineTo(68f * u, 18f * u)
                          path.close()
                          canvas.drawPath(path, gold)
                          canvas.drawCircle(50f * u, 13f * u, 2f * u, glow)
                      }
                  }
              }

              private fun whiteStroke(u: Float): Paint {
                  strokeWhite.strokeWidth = 2.5f * u
                  return strokeWhite
              }
