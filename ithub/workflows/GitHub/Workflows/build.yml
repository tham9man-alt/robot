name:gitHub/workflows/.build.yml

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app app/src/main app/src/main/java/com/example/robotoverlay
          cat > settings.gradle.kts <<'ROBOT_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RobotOverlay"
          include(":app")
          ROBOT_EOF
          cat > build.gradle.kts <<'ROBOT_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ROBOT_EOF
          cat > gradle.properties <<'ROBOT_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          ROBOT_EOF
          cat > app/build.gradle.kts <<'ROBOT_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.robotoverlay"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.robotoverlay"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          ROBOT_EOF
          cat > app/src/main/AndroidManifest.xml <<'ROBOT_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:label="Robot"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".RobotService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Floating animated character overlay" />
                  </service>
              </application>
          </manifest>
          ROBOT_EOF
          cat > app/src/main/java/com/example/robotoverlay/MainActivity.kt <<'ROBOT_EOF'
          package com.example.robotoverlay

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(pad, pad, pad, pad)
                  }

                  val title = TextView(this).apply {
                      text = "الروبوت الصغير 🤖"
                      textSize = 24f
                      gravity = Gravity.CENTER
                  }
                  val hint = TextView(this).apply {
                      text = "اضغط تشغيل ليظهر الروبوت فوق كل التطبيقات.\nاسحبه بإصبعك، اضغط عليه ليلوّح، واتركه يتمشى لحاله."
                      gravity = Gravity.CENTER
                      setPadding(0, pad / 2, 0, pad)
                  }
                  val start = Button(this).apply {
                      text = "تشغيل الروبوت"
                      setOnClickListener { startRobot() }
                  }
                  val stop = Button(this).apply {
                      text = "إيقاف الروبوت"
                      setOnClickListener { stopService(Intent(this@MainActivity, RobotService::class.java)) }
                  }

                  root.addView(title)
                  root.addView(hint)
                  root.addView(start)
                  root.addView(stop)
                  setContentView(root)
              }

              private fun startRobot() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                      return
                  }
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  startForegroundService(Intent(this, RobotService::class.java))
              }
          }
          ROBOT_EOF
          cat > app/src/main/java/com/example/robotoverlay/RobotView.kt <<'ROBOT_EOF'
          package com.example.robotoverlay

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RectF
          import android.os.SystemClock
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.sin

          /** روبوت مرسوم بالكود: يتنفس، يرمش، يلوّح، ينام، وعيونه تتبع اتجاه الحركة. */
          class RobotView(context: Context) : View(context) {

              enum class State { IDLE, HAPPY, SLEEP }

              var state = State.IDLE
                  private set
              var walking = false
              var facing = 1f          // 1 = يمين، -1 = يسار
              var lookX = 0f           // -1..1 اتجاه نظر العيون

              private var happyUntil = 0L
              private var lastActive = SystemClock.uptimeMillis()

              private val metal = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(176, 190, 197) }
              private val dark = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(55, 71, 79) }
              private val white = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val glow = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(0, 229, 255) }
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(55, 71, 79)
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(55, 71, 79)
                  isFakeBoldText = true
              }
              private val rect = RectF()

              fun poke() {
                  val now = SystemClock.uptimeMillis()
                  state = State.HAPPY
                  happyUntil = now + 1500
                  lastActive = now
              }

              fun touchActivity() {
                  val now = SystemClock.uptimeMillis()
                  lastActive = now
                  if (state == State.SLEEP) state = State.IDLE
              }

              override fun onDraw(canvas: Canvas) {
                  val now = SystemClock.uptimeMillis()
                  if (state == State.HAPPY && now > happyUntil) state = State.IDLE
                  if (state == State.IDLE && !walking && now - lastActive > 20_000) state = State.SLEEP
                  if (walking) lastActive = now

                  val t = now / 1000f
                  val u = width / 100f
                  line.strokeWidth = 3f * u

                  val bob = when {
                      state == State.HAPPY -> -abs(sin(t * 10f)) * 9f * u
                      walking -> -abs(sin(t * 9f)) * 3f * u
                      state == State.SLEEP -> sin(t * 1.2f) * 1f * u
                      else -> sin(t * 3f) * 1.8f * u
                  }

                  canvas.save()
                  if (facing < 0) canvas.scale(-1f, 1f, width / 2f, height / 2f)
                  canvas.translate(0f, bob)

                  // هوائي
                  canvas.drawLine(50f * u, 18f * u, 50f * u, 9f * u, line)
                  val pulse = if (state == State.SLEEP) 3f else 4f + sin(t * 5f)
                  glow.alpha = if (state == State.SLEEP) 90 else 255
                  canvas.drawCircle(50f * u, 7f * u, pulse * u, glow)

                  // أرجل
                  rect.set(34f * u, 86f * u, 46f * u, 97f * u); canvas.drawRoundRect(rect, 3f * u, 3f * u, dark)
                  rect.set(54f * u, 86f * u, 66f * u, 97f * u); canvas.drawRoundRect(rect, 3f * u, 3f * u, dark)

                  // ذراع يسار (خلفية)
                  canvas.drawLine(28f * u, 64f * u, 17f * u, 80f * u, line)

                  // جسم
                  rect.set(28f * u, 56f * u, 72f * u, 88f * u); canvas.drawRoundRect(rect, 8f * u, 8f * u, metal)
                  glow.alpha = 255
                  canvas.drawCircle(50f * u, 72f * u, 5f * u, glow)

                  // ذراع يمين: تلوّح عند الفرح
                  val armEndX: Float
                  val armEndY: Float
                  if (state == State.HAPPY) {
                      armEndX = 84f * u + sin(t * 14f) * 4f * u
                      armEndY = 40f * u
                  } else {
                      armEndX = 83f * u
                      armEndY = 80f * u + (if (walking) sin(t * 9f) * 3f * u else 0f)
                  }
                  canvas.drawLine(72f * u, 64f * u, armEndX, armEndY, line)

                  // رأس
                  rect.set(22f * u, 18f * u, 78f * u, 54f * u); canvas.drawRoundRect(rect, 11f * u, 11f * u, metal)
                  rect.set(27f * u, 23f * u, 73f * u, 49f * u); canvas.drawRoundRect(rect, 8f * u, 8f * u, dark)

                  drawFace(canvas, u, t)
                  canvas.restore()

                  if (state == State.SLEEP) {
                      text.textSize = 11f * u
                      canvas.drawText("z", 78f * u, 20f * u - (t * 6f * u) % (8f * u), text)
                      text.textSize = 8f * u
                      canvas.drawText("z", 86f * u, 30f * u - (t * 5f * u) % (6f * u), text)
                  }

                  postInvalidateOnAnimation()
              }

              private fun drawFace(canvas: Canvas, u: Float, t: Float) {
                  val ex = floatArrayOf(39f, 61f)
                  val ey = 36f
                  when {
                      state == State.SLEEP -> {
                          for (x in ex) canvas.drawLine((x - 5f) * u, ey * u, (x + 5f) * u, ey * u, whiteStroke(u))
                      }
                      state == State.HAPPY -> {
                          for (x in ex) {
                              rect.set((x - 5f) * u, (ey - 4f) * u, (x + 5f) * u, (ey + 6f) * u)
                              canvas.drawArc(rect, 200f, 140f, false, whiteStroke(u))
                          }
                      }
                      else -> {
                          val blink = (t % 4f) < 0.14f
                          for (x in ex) {
                              if (blink) {
                                  canvas.drawLine((x - 5f) * u, ey * u, (x + 5f) * u, ey * u, whiteStroke(u))
                              } else {
                                  canvas.drawCircle(x * u, ey * u, 6f * u, white)
                                  canvas.drawCircle((x + lookX * 2.5f) * u, ey * u, 3f * u, dark)
                              }
                          }
                      }
                  }
                  // فم
                  rect.set(44f * u, 38f * u, 56f * u, 46f * u)
                  if (state == State.HAPPY) canvas.drawArc(rect, 20f, 140f, false, whiteStroke(u))
                  else if (state != State.SLEEP) canvas.drawLine(45f * u, 44f * u, 55f * u, 44f * u, whiteStroke(u))
              }

              private val strokeWhite = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  style = Paint.Style.STROKE
                  strokeCap = Paint.Cap.ROUND
              }

              private fun whiteStroke(u: Float): Paint {
                  strokeWhite.strokeWidth = 2.5f * u
                  return strokeWhite
              }
          }
          ROBOT_EOF
          cat > app/src/main/java/com/example/robotoverlay/RobotService.kt <<'ROBOT_EOF'
          package com.example.robotoverlay

          import android.animation.ValueAnimator
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.animation.LinearInterpolator
          import kotlin.math.abs
          import kotlin.math.hypot
          import kotlin.random.Random

          class RobotService : Service() {

              private lateinit var wm: WindowManager
              private var robot: RobotView? = null
              private lateinit var params: WindowManager.LayoutParams
              private val handler = Handler(Looper.getMainLooper())
              private var walkAnimator: ValueAnimator? = null
              private var dragging = false

              private val sizePx get() = (120 * resources.displayMetrics.density).toInt()

              private val wander = object : Runnable {
                  override fun run() {
                      val r = robot ?: return
                      if (!dragging && r.state == RobotView.State.IDLE) walkToRandomSpot()
                      handler.postDelayed(this, Random.nextLong(4000, 9000))
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  startAsForeground()
                  addRobot()
                  handler.postDelayed(wander, 3000)
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  walkAnimator?.cancel()
                  robot?.let { runCatching { wm.removeView(it) } }
                  robot = null
                  super.onDestroy()
              }

              private fun startAsForeground() {
                  val channelId = "robot_overlay"
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(channelId, "Robot", NotificationManager.IMPORTANCE_LOW)
                  )
                  val stopIntent = PendingIntent.getService(
                      this, 0,
                      Intent(this, RobotService::class.java).setAction("STOP"),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val notification = Notification.Builder(this, channelId)
                      .setContentTitle("الروبوت شغّال")
                      .setContentText("اسحب الإشعار للأسفل لإيقافه")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .addAction(
                          Notification.Action.Builder(
                              android.R.drawable.ic_menu_close_clear_cancel, "إيقاف", stopIntent
                          ).build()
                      )
                      .setOngoing(true)
                      .build()
                  startForeground(1, notification)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  return START_STICKY
              }

              private fun addRobot() {
                  val view = RobotView(this)
                  val dm = resources.displayMetrics
                  params = WindowManager.LayoutParams(
                      sizePx, sizePx,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dm.widthPixels / 2 - sizePx / 2
                      y = dm.heightPixels / 2
                  }

                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var moved = false

                  view.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              walkAnimator?.cancel()
                              view.walking = false
                              dragging = true
                              moved = false
                              downX = e.rawX; downY = e.rawY
                              startX = params.x; startY = params.y
                              view.touchActivity()
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              if (hypot(dx, dy) > 12f) moved = true
                              if (moved) {
                                  params.x = (startX + dx).toInt()
                                  params.y = (startY + dy).toInt()
                                  if (abs(dx) > 6f) view.facing = if (dx > 0) 1f else -1f
                                  view.lookX = (dx / 150f).coerceIn(-1f, 1f)
                                  updateLayout(view)
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              dragging = false
                              view.lookX = 0f
                              if (!moved) view.poke()
                          }
                      }
                      true
                  }

                  wm.addView(view, params)
                  robot = view
              }

              private fun updateLayout(view: RobotView) {
                  runCatching { wm.updateViewLayout(view, params) }
              }

              private fun walkToRandomSpot() {
                  val view = robot ?: return
                  val dm = resources.displayMetrics
                  val targetX = Random.nextInt(0, (dm.widthPixels - sizePx).coerceAtLeast(1))
                  val targetY = Random.nextInt(
                      (dm.heightPixels * 0.2f).toInt(),
                      (dm.heightPixels * 0.7f).toInt().coerceAtLeast((dm.heightPixels * 0.2f).toInt() + 1)
                  )
                  val fromX = params.x
                  val fromY = params.y
                  val dist = hypot((targetX - fromX).toFloat(), (targetY - fromY).toFloat())

                  view.facing = if (targetX >= fromX) 1f else -1f
                  view.lookX = view.facing
                  view.walking = true

                  walkAnimator?.cancel()
                  walkAnimator = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = (dist / dm.density * 9f).toLong().coerceIn(800L, 5000L)
                      interpolator = LinearInterpolator()
                      addUpdateListener {
                          val f = it.animatedValue as Float
                          params.x = (fromX + (targetX - fromX) * f).toInt()
                          params.y = (fromY + (targetY - fromY) * f).toInt()
                          updateLayout(view)
                      }
                      addListener(object : android.animation.AnimatorListenerAdapter() {
                          override fun onAnimationEnd(animation: android.animation.Animator) {
                              view.walking = false
                              view.lookX = 0f
                          }
                      })
                      start()
                  }
              }
          }
          ROBOT_EOF

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: robot-${{ github.run_number }}
          name: Robot APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
