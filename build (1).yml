              private fun menuItem(label: String, action: () -> Unit): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.textSize = 15f
                  t.setTextColor(Color.rgb(38, 50, 56))
                  t.setPadding(dp(14), dp(10), dp(14), dp(10))
                  t.setOnClickListener {
                      removeMenu()
                      action()
                  }
                  return t
              }

              private fun showMenu() {
                  removeBubble()
                  removeMenu()
                  val dm = resources.displayMetrics
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  val bg = GradientDrawable()
                  bg.setColor(Color.WHITE)
                  bg.cornerRadius = dp(16).toFloat()
                  bg.setStroke(dp(1), Color.rgb(176, 190, 197))
                  box.background = bg
                  box.setPadding(0, dp(6), 0, dp(6))

                  box.addView(menuItem("📧  افتح البريد") { openEmail() })
                  box.addView(menuItem("✉️  رسالة بريد جديدة") { composeEmail() })
                  box.addView(menuItem("💬  اقتباس") { sayQuote() })
                  box.addView(menuItem("✅  مهامي والإعدادات") { openApp() })
                  val soundOn = TaskStore.sound(this)
                  box.addView(menuItem(if (soundOn) "🔇  اكتم الصوت" else "🔊  شغّل الصوت") {
                      TaskStore.setSound(this, !soundOn)
                      say(if (soundOn) "تمام، بدون صوت" else "رجع الصوت", 2500, true)
                  })
                  box.addView(menuItem("✖  إغلاق") { })

                  box.setOnTouchListener { _, e ->
                      if (e.action == MotionEvent.ACTION_OUTSIDE) removeMenu()
                      false
                  }

                  box.measure(
                      View.MeasureSpec.makeMeasureSpec((dm.widthPixels * 0.8f).toInt(), View.MeasureSpec.AT_MOST),
                      View.MeasureSpec.makeMeasureSpec(0, View.MeasureSpec.UNSPECIFIED)
                  )
                  val w = box.measuredWidth
                  val h = box.measuredHeight
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = (params.x + sizePx / 2 - w / 2).coerceIn(0, (dm.widthPixels - w).coerceAtLeast(0))
                  val below = params.y + sizePx
                  lp.y = if (below + h < dm.heightPixels) below else (params.y - h).coerceAtLeast(0)
                  wm.addView(box, lp)
                  menu = box
                  robot?.poke()
                  handler.postDelayed(hideMenu, 8000)
              }

              // ---------- الروبوت نفسه ----------

              private fun addRobot() {
                  val view = RobotView(this)
                  val dm = resources.displayMetrics
                  params = WindowManager.LayoutParams(
                      sizePx, sizePx,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dm.widthPixels / 2 - sizePx / 2
                      y = dm.heightPixels / 2
                  }

                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  var moved = false
                  var didLong = false
                  val longPress = Runnable {
                      if (!moved) {
                          didLong = true
                          say(jokes[Random.nextInt(jokes.size)], 7000, true)
                      }
                  }

                  view.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              walkAnimator?.cancel()
                              view.walking = false
                              removeMenu()
                              dragging = true
                              moved = false
                              didLong = false
                              handler.postDelayed(longPress, 700)
                              downX = e.rawX; downY = e.rawY
                              startX = params.x; startY = params.y
                              view.touchActivity()
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - downX
                              val dy = e.rawY - downY
                              if (hypot(dx, dy) > 12f) {
                                  moved = true
                                  handler.removeCallbacks(longPress)
                              }
                              if (moved) {
                                  params.x = (startX + dx).toInt()
                                  params.y = (startY + dy).toInt()
                                  if (abs(dx) > 6f) view.facing = if (dx > 0) 1f else -1f
                                  view.lookX = (dx / 150f).coerceIn(-1f, 1f)
                                  updateLayout(view)
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              handler.removeCallbacks(longPress)
                              dragging = false
                              view.lookX = 0f
                              if (!moved && !didLong) {
                                  val now = SystemClock.uptimeMillis()
                                  if (now - lastTapTime < 350) {
                                      handler.removeCallbacks(singleTap)
                                      lastTapTime = 0L
                                      showMenu()
                                  } else {
                                      lastTapTime = now
                                      handler.postDelayed(singleTap, 350)
                                  }
                              }
                          }
                      }
                      true
                  }

                  wm.addView(view, params)
                  robot = view
                  applyLook()
              }

              private fun updateLayout(view: RobotView) {
                  runCatching { wm.updateViewLayout(view, params) }
                  positionBubble()
              }

              private fun walkToRandomSpot() {
                  val view = robot ?: return
                  val dm = resources.displayMetrics
                  val targetX = Random.nextInt(0, (dm.widthPixels - sizePx).coerceAtLeast(1))
                  val targetY = Random.nextInt(
                      (dm.heightPixels * 0.2f).toInt(),
                      (dm.heightPixels * 0.7f).toInt().coerceAtLeast((dm.heightPixels * 0.2f).toInt() + 1)
                  )
                  val factor = RobotStyle.speedFactor[TaskStore.speed(this)]
                  if (factor <= 0f) return
                  val fromX = params.x
                  val fromY = params.y
                  val dist = hypot((targetX - fromX).toFloat(), (targetY - fromY).toFloat())

                  view.facing = if (targetX >= fromX) 1f else -1f
                  view.lookX = view.facing
                  view.walking = true

                  walkAnimator?.cancel()
                  walkAnimator = ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = (dist / dm.density * 9f / factor).toLong().coerceIn(500L, 9000L)
                      interpolator = LinearInterpolator()
                      addUpdateListener {
                          val f = it.animatedValue as Float
                          params.x = (fromX + (targetX - fromX) * f).toInt()
                          params.y = (fromY + (targetY - fromY) * f).toInt()
                          updateLayout(view)
                      }
                      addListener(object : android.animation.AnimatorListenerAdapter() {
                          override fun onAnimationEnd(animation: android.animation.Animator) {
                              view.walking = false
                              view.lookX = 0f
                          }
                      })
                      start()
                  }
              }
          }
          ROBOT_EOF
          cat > app/src/main/java/com/example/robotoverlay/TaskStore.kt <<'ROBOT_EOF'
          package com.example.robotoverlay

          import android.content.Context
          import android.graphics.Color
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Locale

          data class Task(
              val id: Long,
              val text: String,
              val minutes: Int,      // وقت التذكير بالدقائق من منتصف الليل، -1 يعني بدون وقت
              val done: Boolean,
              val firedDay: String,  // آخر يوم تم التذكير فيه
              val date: String = ""  // تاريخ المهمة yyyy-MM-dd أو فارغ = كل يوم
          )

          object TaskStore {
              private const val PREFS = "robot_tasks"
              private const val KEY_TASKS = "tasks"
              private const val KEY_WATER = "water"
              private const val KEY_SOUND = "sound"
              private const val KEY_SPEED = "speed"
              const val KEY_COLOR = "color"
              const val KEY_ACC = "acc"

              fun prefs(c: Context) = c.getSharedPreferences(PREFS, Context.MODE_PRIVATE)

              fun fmt(minutes: Int): String =
                  String.format(Locale.US, "%02d:%02d", minutes / 60, minutes % 60)

              fun load(c: Context): List<Task> {
                  val raw = prefs(c).getString(KEY_TASKS, "[]") ?: "[]"
                  val arr = runCatching { JSONArray(raw) }.getOrElse { JSONArray() }
                  val out = ArrayList<Task>()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      out.add(
                          Task(
                              o.optLong("id"),
                              o.optString("text"),
                              o.optInt("minutes", -1),
                              o.optBoolean("done", false),
                              o.optString("firedDay", ""),
                              o.optString("date", "")
                          )
                      )
                  }
                  return out
              }

              private fun save(c: Context, tasks: List<Task>) {
                  val arr = JSONArray()
                  for (t in tasks) {
                      val o = JSONObject()
                      o.put("id", t.id)
                      o.put("text", t.text)
                      o.put("minutes", t.minutes)
                      o.put("done", t.done)
                      o.put("firedDay", t.firedDay)
                      o.put("date", t.date)
                      arr.put(o)
                  }
                  prefs(c).edit().putString(KEY_TASKS, arr.toString()).apply()
              }

              fun add(c: Context, text: String, minutes: Int, date: String) {
                  val list = load(c).toMutableList()
                  list.add(Task(System.currentTimeMillis(), text, minutes, false, "", date))
                  save(c, list)
              }

              fun toggle(c: Context, id: Long) {
                  save(c, load(c).map { if (it.id == id) it.copy(done = !it.done) else it })
              }

              fun remove(c: Context, id: Long) {
                  save(c, load(c).filter { it.id != id })
              }

              fun markFired(c: Context, id: Long, day: String) {
                  save(c, load(c).map { if (it.id == id) it.copy(firedDay = day) else it })
              }

              // اقتباسات يضيفها المستخدم بنفسه (تُخزَّن كل واحدة في سطر)
              fun quotes(c: Context): List<String> =
                  (prefs(c).getString("quotes", "") ?: "").split("\n").map { it.trim() }.filter { it.isNotEmpty() }

              fun addQuote(c: Context, q: String) {
                  val list = quotes(c).toMutableList()
                  list.add(q.replace("\n", " ").trim())
                  prefs(c).edit().putString("quotes", list.joinToString("\n")).apply()
              }

              fun removeQuote(c: Context, index: Int) {
                  val list = quotes(c).toMutableList()
                  if (index in list.indices) list.removeAt(index)
                  prefs(c).edit().putString("quotes", list.joinToString("\n")).apply()
              }

              fun water(c: Context): Boolean = prefs(c).getBoolean(KEY_WATER, true)

              fun setWater(c: Context, on: Boolean) {
                  prefs(c).edit().putBoolean(KEY_WATER, on).apply()
              }

              fun sound(c: Context): Boolean = prefs(c).getBoolean(KEY_SOUND, true)

              fun setSound(c: Context, on: Boolean) {
                  prefs(c).edit().putBoolean(KEY_SOUND, on).apply()
              }

              fun speed(c: Context): Int =
                  prefs(c).getInt(KEY_SPEED, 2).coerceIn(0, RobotStyle.speeds.size - 1)

              fun setSpeed(c: Context, index: Int) {
                  prefs(c).edit().putInt(KEY_SPEED, index).apply()
              }

              fun color(c: Context): Int =
                  prefs(c).getInt(KEY_COLOR, 0).coerceIn(0, RobotColors.body.size - 1)

              fun setColor(c: Context, index: Int) {
                  prefs(c).edit().putInt(KEY_COLOR, index).apply()
              }

              fun accessory(c: Context): Int =
                  prefs(c).getInt(KEY_ACC, 0).coerceIn(0, RobotStyle.accessories.size - 1)

              fun setAccessory(c: Context, index: Int) {
                  prefs(c).edit().putInt(KEY_ACC, index).apply()
              }
          }

          object RobotColors {
              val names = listOf(
                  "فولاذي", "أزرق", "أحمر", "أخضر",
                  "بنفسجي", "أصفر", "وردي", "برتقالي",
                  "تركوازي", "ذهبي", "لؤلؤي", "فحمي"
              )

              val body = listOf(
                  Color.rgb(176, 190, 197),
                  Color.rgb(100, 181, 246),
                  Color.rgb(239, 154, 154),
                  Color.rgb(165, 214, 167),
                  Color.rgb(206, 147, 216),
                  Color.rgb(255, 224, 130),
                  Color.rgb(244, 143, 177),
                  Color.rgb(255, 183, 77),
                  Color.rgb(128, 203, 196),
                  Color.rgb(212, 175, 55),
                  Color.rgb(236, 239, 241),
                  Color.rgb(84, 110, 122)
              )

              val glow = listOf(
                  Color.rgb(0, 229, 255),
                  Color.rgb(0, 229, 255),
                  Color.rgb(255, 82, 82),
                  Color.rgb(105, 240, 174),
                  Color.rgb(224, 64, 251),
                  Color.rgb(255, 196, 0),
                  Color.rgb(255, 64, 129),
                  Color.rgb(255, 109, 0),
                  Color.rgb(29, 233, 182),
                  Color.rgb(255, 215, 0),
                  Color.rgb(0, 176, 255),
                  Color.rgb(0, 229, 255)
              )
          }

          object RobotStyle {
              val accessories = listOf("بدون", "نظارة", "قبعة", "ربطة عنق", "تاج")
              val speeds = listOf("ثابت", "بطيء", "عادي", "سريع")
              val speedFactor = listOf(0f, 0.6f, 1f, 1.8f)
          }
          ROBOT_EOF

